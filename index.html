<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>訃聞辨識建檔系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .loading-spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        width: 1.25rem;
        height: 1.25rem;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen">
    <header class="bg-slate-900 text-white shadow-md">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-3"
      >
        <div class="flex items-center space-x-3">
          <span class="text-2xl">📜</span>
          <div>
            <h1 class="text-xl font-bold tracking-wide">訃聞辨識建檔系統</h1>
            <p class="text-xs text-slate-400">
              拍照上傳 ➔ AI智慧解析 ➔ 人工校對 ➔ 雲端歸檔
            </p>
          </div>
        </div>
        <div
          class="flex items-center space-x-2 text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700"
        >
          <span
            class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"
          ></span>
          <span class="text-slate-300">防幻覺高精準版</span>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
      <!-- 設定面板 -->
      <div
        class="mb-6 bg-white border border-slate-200 rounded-xl p-4 shadow-sm"
      >
        <div
          class="flex items-center justify-between mb-3 cursor-pointer"
          onclick="toggleSettings()"
        >
          <div class="flex items-center space-x-2">
            <span class="text-lg">⚙️</span>
            <h2 class="text-sm font-semibold text-slate-700">
              金鑰與後端網址設定
            </h2>
          </div>
          <span
            id="settingsToggleText"
            class="text-xs text-indigo-600 font-medium"
            >展開 / 收合</span
          >
        </div>
        <div
          id="settingsPanel"
          class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t border-slate-100"
        >
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">
              Gemini API Key
              <a
                href="https://aistudio.google.com/app/apikey"
                target="_blank"
                class="text-indigo-600 hover:underline font-normal ml-1"
                >點此獲取</a
              >
            </label>
            <input
              type="password"
              id="geminiApiKey"
              placeholder="AIzaSy..."
              class="w-full text-xs px-3 py-2 border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"
              >Google Apps Script 網址 (/exec)</label
            >
            <input
              type="text"
              id="gasUrl"
              placeholder="https://script.google.com/macros/s/.../exec"
              class="w-full text-xs px-3 py-2 border rounded-lg border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div class="md:col-span-2 flex justify-between items-center">
            <span id="keyStatusMsg" class="text-xs text-slate-500"></span>
            <button
              type="button"
              onclick="saveSettings()"
              class="text-xs bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition"
            >
              記住設定
            </button>
          </div>
        </div>
      </div>

      <!-- 核心雙欄 -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- 左欄：圖片選取與預覽 -->
        <div class="lg:col-span-5 flex flex-col space-y-4">
          <div
            class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sticky top-6"
          >
            <h3
              class="font-bold text-slate-800 text-base mb-3 flex items-center gap-2"
            >
              <span>📷</span> 步驟 1：上傳訃聞
            </h3>

            <div class="mb-4">
              <label
                class="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer bg-slate-50 hover:bg-indigo-50/50 hover:border-indigo-400 transition-colors"
              >
                <div
                  class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4"
                >
                  <svg
                    class="w-8 h-8 mb-2 text-slate-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                    />
                  </svg>
                  <p class="mb-1 text-xs text-slate-600">
                    <span class="font-semibold text-indigo-600"
                      >點此選取圖片</span
                    >
                    或拖曳檔案到這裡
                  </p>
                  <p class="text-[11px] text-slate-400">
                    支援手機拍照 (JPG, PNG)
                  </p>
                </div>
                <input
                  type="file"
                  id="imageInput"
                  accept="image/*"
                  class="hidden"
                  onchange="handleImageSelect(event)"
                />
              </label>
            </div>

            <div
              id="previewContainer"
              class="hidden border border-slate-200 rounded-lg overflow-hidden relative bg-slate-900/5 max-h-96 flex items-center justify-center"
            >
              <img
                id="imagePreview"
                src=""
                alt="訃聞預覽"
                class="max-h-96 w-auto object-contain"
              />
            </div>

            <div class="mt-4">
              <button
                type="button"
                id="btnOcr"
                onclick="startAiExtraction()"
                disabled
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-lg font-medium text-sm transition flex items-center justify-center gap-2 shadow cursor-pointer"
              >
                <span id="btnOcrSpinner" class="loading-spinner hidden"></span>
                <span id="btnOcrText">✨開始辨識</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 右欄：人工校對表單 (共 19 項資訊) -->
        <div class="lg:col-span-7">
          <div
            class="bg-white rounded-xl shadow-sm border border-slate-200 p-5"
          >
            <div
              class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3"
            >
              <h3
                class="font-bold text-slate-800 text-base flex items-center gap-2"
              >
                <span>✍️</span> 步驟 2：校對並補充欄位
              </h3>
              <span
                class="text-xs px-2.5 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-full font-medium"
                >請確認無誤後儲存</span
              >
            </div>

            <form
              id="recordForm"
              onsubmit="saveToCloud(event)"
              class="space-y-4 text-xs"
            >
              <!-- 姓名與輓聯抬頭並列 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1"
                    >往生者姓名 *</label
                  >
                  <input
                    type="text"
                    id="name"
                    required
                    class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="請確認本名"
                  />
                </div>
                <div>
                  <label class="block font-semibold text-indigo-700 mb-1"
                    >訃聞全銜 / 抬頭*</label
                  >
                  <input
                    type="text"
                    id="formalTitle"
                    class="w-full text-sm px-3 py-2 border rounded-lg border-indigo-200 bg-indigo-50/30 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="例：陳公大華老先生"
                  />
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1"
                    >年紀</label
                  >
                  <input
                    type="text"
                    id="age"
                    class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="例：86"
                  />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1"
                    >過世日期</label
                  >
                  <input
                    type="text"
                    id="deathDate"
                    class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="例：2026年9月8日"
                  />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1"
                    >出殯日期時間</label
                  >
                  <input
                    type="text"
                    id="serviceDate"
                    class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="例：2026年9月23日 11:30"
                  />
                </div>
              </div>

              <!-- 地點雙欄：告別式地點 + 停靈地點 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-slate-700 mb-1"
                    >告別式地點</label
                  >
                  <input
                    type="text"
                    id="location"
                    class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="舉行公奠之禮廳"
                  />
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1"
                    >停靈地點 (靈堂設置處)</label
                  >
                  <input
                    type="text"
                    id="vigilLocation"
                    class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="停靈處或靈堂(無則空白)"
                  />
                </div>
              </div>

              <div>
                <label class="block font-semibold text-slate-700 mb-1"
                  >主要家屬</label
                >
                <textarea
                  id="familyMembers"
                  rows="3"
                  class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none leading-relaxed"
                  placeholder="主要家屬名冊"
                ></textarea>
              </div>

              <!-- 電話資訊 (支援多支完整並列) -->
              <div class="border-t border-slate-100 pt-3">
                <div class="flex items-center justify-between mb-2">
                  <span class="block text-xs font-bold text-indigo-700"
                    >📞 聯絡電話資訊</span
                  >
                  <span class="text-[11px] text-slate-400"></span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div>
                    <label class="block font-semibold text-slate-700 mb-1"
                      >市話區碼</label
                    >
                    <input
                      type="text"
                      id="phoneAreaCode"
                      class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      placeholder="例：07"
                    />
                  </div>
                  <div>
                    <label class="block font-semibold text-slate-700 mb-1"
                      >室內電話</label
                    >
                    <input
                      type="text"
                      id="tel"
                      class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      placeholder="多支以 / 分開"
                    />
                  </div>
                  <div>
                    <label class="block font-semibold text-slate-700 mb-1"
                      >手機電話</label
                    >
                    <input
                      type="text"
                      id="mobile"
                      class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      placeholder="多支以 / 分開"
                    />
                  </div>
                </div>
              </div>

              <!-- 地址結構化拆解 (聯絡處優先) -->
              <div class="border-t border-slate-100 pt-3">
                <div class="flex items-center justify-between mb-2">
                  <span class="block text-xs font-bold text-indigo-700"
                    >📍 詳細通訊地址</span
                  >
                  <span class="text-[11px] text-slate-400"></span>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-2">
                  <div>
                    <label class="block font-semibold text-slate-700 mb-1"
                      >縣市</label
                    >
                    <input
                      type="text"
                      id="city"
                      oninput="assembleAddress()"
                      class="w-full text-sm px-2.5 py-1.5 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      placeholder="縣市"
                    />
                  </div>
                  <div>
                    <label class="block font-semibold text-slate-700 mb-1"
                      >區/鄉鎮</label
                    >
                    <input
                      type="text"
                      id="district"
                      oninput="assembleAddress()"
                      class="w-full text-sm px-2.5 py-1.5 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      placeholder="區/鄉鎮"
                    />
                  </div>
                  <div>
                    <label class="block font-semibold text-slate-700 mb-1"
                      >里/村</label
                    >
                    <input
                      type="text"
                      id="village"
                      oninput="assembleAddress()"
                      class="w-full text-sm px-2.5 py-1.5 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      placeholder="里/村"
                    />
                  </div>
                  <div>
                    <label class="block font-semibold text-slate-700 mb-1"
                      >門牌號/路段</label
                    >
                    <input
                      type="text"
                      id="street"
                      oninput="assembleAddress()"
                      class="w-full text-sm px-2.5 py-1.5 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      placeholder="路段門牌"
                    />
                  </div>
                </div>
                <div>
                  <label class="block font-semibold text-slate-700 mb-1"
                    >完整地址</label
                  >
                  <input
                    type="text"
                    id="fullAddress"
                    class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50"
                    placeholder="完整通訊地址全稱"
                  />
                </div>
              </div>

              <!-- 其他備註 (留空手動填寫) -->
              <div class="border-t border-slate-100 pt-3">
                <label class="block font-semibold text-slate-700 mb-1"
                  >其他事項 / 備註</label
                >
                <input
                  type="text"
                  id="notes"
                  class="w-full text-sm px-3 py-2 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  placeholder="人工填寫註記"
                />
              </div>

              <div
                class="pt-3 border-t border-slate-100 flex items-center justify-between gap-4"
              >
                <div
                  id="statusMsg"
                  class="text-xs text-slate-500 truncate"
                ></div>
                <button
                  type="submit"
                  id="btnSave"
                  class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold text-sm transition flex items-center gap-2 shadow cursor-pointer"
                >
                  <span
                    id="btnSaveSpinner"
                    class="loading-spinner hidden"
                  ></span>
                  <span id="btnSaveText">💾 確認校對無誤，儲存至雲端</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <iframe
      name="hidden_upload_frame"
      id="hidden_upload_frame"
      style="display: none"
    ></iframe>

    <script>
      let base64Image = "";
      let mimeType = "image/jpeg";

      window.onload = function () {
        try {
          const savedKey = localStorage.getItem("obituary_gemini_key");
          const savedGas = localStorage.getItem("obituary_gas_url");
          if (savedKey)
            document.getElementById("geminiApiKey").value = savedKey;
          if (savedGas) document.getElementById("gasUrl").value = savedGas;
        } catch (e) {}
      };

      function toggleSettings() {
        document.getElementById("settingsPanel").classList.toggle("hidden");
      }

      function saveSettings() {
        const key = document.getElementById("geminiApiKey").value.trim();
        const gas = document.getElementById("gasUrl").value.trim();
        try {
          localStorage.setItem("obituary_gemini_key", key);
          localStorage.setItem("obituary_gas_url", gas);
        } catch (e) {}
        alert("設定已儲存！");
      }

      function assembleAddress() {
        const c = document.getElementById("city").value.trim();
        const d = document.getElementById("district").value.trim();
        const v = document.getElementById("village").value.trim();
        const s = document.getElementById("street").value.trim();
        document.getElementById("fullAddress").value = c + d + v + s;
      }

      function handleImageSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        mimeType = file.type || "image/jpeg";
        const reader = new FileReader();

        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            const maxDim = 1200;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.75);
            base64Image = compressedDataUrl.split(",")[1];
            mimeType = "image/jpeg";

            document.getElementById("imagePreview").src = compressedDataUrl;
            document
              .getElementById("previewContainer")
              .classList.remove("hidden");
            document.getElementById("btnOcr").disabled = false;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      async function startAiExtraction() {
        const apiKey = document.getElementById("geminiApiKey").value.trim();
        if (!apiKey) {
          alert("請先在上方設定填入 Gemini API Key！");
          return;
        }
        if (!base64Image) {
          alert("請先選擇訃聞相片！");
          return;
        }

        const btn = document.getElementById("btnOcr");
        const sp = document.getElementById("btnOcrSpinner");
        const txt = document.getElementById("btnOcrText");
        btn.disabled = true;
        sp.classList.remove("hidden");
        txt.innerText = "辨識中...";

        // 徹底去除具體假資料範例，增加負向禁止指令
        const prompt = `你是一個嚴謹的繁體中文訃聞 OCR 資訊提取工具。請嚴格根據這張圖片中的真實文字進行提取，並輸出純 JSON 格式。

【絕對真實性規範 (禁止任何幻想或捏造)】
1. 嚴格禁止編造任何圖片中不存在的文字、姓名、地址、日期或電話。
2. 只要圖片中沒有提及某項欄位，該鍵的值【必須直接填寫空字串 ""】，絕不可自行推理或帶入常識猜測。
3. 嚴格禁止將說明文字中的字眼當作辨識結果輸出。

【提取規則】
- "name": 逝者本名（僅姓名本身）。
- "formalTitle": 訃聞全銜/抬頭。必須過濾去除「顯考、顯妣、先慈、先考、諱」等字樣，僅保留敬稱稱謂主體。若圖中無全銜請填入本名。
- "age": 年紀。提取享壽或享年數字，並統一轉換為純阿拉伯數字字串（若圖中未註明則填 ""）。
- "deathDate": 逝世日期。換算為西元公曆，格式統一為「YYYY年M月D日」（若圖中無則填 ""）。
- "serviceDate": 出殯/告別式時間。換算為西元公曆24小時制，格式統一為「YYYY年M月D日 HH:mm」（若無具體時間則僅填日期，若圖中無則填 ""）。
- "location": 告別式地點。僅填寫舉行公奠出殯之禮廳會場（若圖中無則填 ""）。
- "vigilLocation": 停靈地點。僅填寫平時停靈、守靈或靈堂設置處（若圖中未提及停靈處，一律填 ""，切勿重複填入告別式會場）。
- "familyMembers": 主要家屬名冊條列（若圖中無則填 ""）。
- "phoneAreaCode": 市話區碼（若有多組不同區碼請以 / 分隔，無則填 ""）。
- "tel": 所有室內電話。請掃描全圖，若有兩支以上室話請全部列出，號碼間以斜線 " / " 分隔（無則填 ""）。
- "mobile": 所有手機號碼。請掃描全圖，若有兩支以上手機請全部列出，號碼間以斜線 " / " 分隔（無則填 ""）。
- "city", "district", "village", "street", "fullAddress": 詳細地址拆解與完整地址。若圖中同時出現治喪處與聯絡處/通訊處，一律優先提取【聯絡處地址】（無則填 ""）。
- "notes": 必須固定回傳空字串 ""。

請回傳符合下列鍵值的純 JSON 格式：
{
  "name": "",
  "formalTitle": "",
  "age": "",
  "deathDate": "",
  "serviceDate": "",
  "location": "",
  "vigilLocation": "",
  "familyMembers": "",
  "phoneAreaCode": "",
  "tel": "",
  "mobile": "",
  "city": "",
  "district": "",
  "village": "",
  "street": "",
  "fullAddress": "",
  "notes": ""
}`;

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      { text: prompt },
                      {
                        inline_data: { mime_type: mimeType, data: base64Image },
                      },
                    ],
                  },
                ],
                // 鎖定 temperature: 0，強制純事實謄抄，徹底杜絕幻覺
                generationConfig: {
                  response_mime_type: "application/json",
                  temperature: 0,
                },
              }),
            },
          );

          const data = await response.json();
          if (data.error) throw new Error(data.error.message || "辨識出錯");

          const result = JSON.parse(data.candidates[0].content.parts[0].text);

          document.getElementById("name").value = result.name || "";
          document.getElementById("formalTitle").value =
            result.formalTitle || "";
          document.getElementById("age").value = result.age || "";
          document.getElementById("deathDate").value = result.deathDate || "";
          document.getElementById("serviceDate").value =
            result.serviceDate || "";
          document.getElementById("location").value = result.location || "";
          document.getElementById("vigilLocation").value =
            result.vigilLocation || "";
          document.getElementById("familyMembers").value =
            result.familyMembers || "";
          document.getElementById("phoneAreaCode").value =
            result.phoneAreaCode || "";
          document.getElementById("tel").value = result.tel || "";
          document.getElementById("mobile").value = result.mobile || "";
          document.getElementById("city").value = result.city || "";
          document.getElementById("district").value = result.district || "";
          document.getElementById("village").value = result.village || "";
          document.getElementById("street").value = result.street || "";
          document.getElementById("fullAddress").value =
            result.fullAddress || "";
          document.getElementById("notes").value = "";

          showStatus("辨識完成！", "text-emerald-600 font-medium");
        } catch (err) {
          alert("AI 辨識失敗: " + err.message);
          showStatus("辨識失敗: " + err.message, "text-rose-600");
        } finally {
          btn.disabled = false;
          sp.classList.add("hidden");
          txt.innerText = "✨ 開始辨識";
        }
      }

      function saveToCloud(event) {
        event.preventDefault();

        const gasUrl = document.getElementById("gasUrl").value.trim();
        if (!gasUrl) {
          alert("請先在上方設定填入 Google Apps Script 網址！");
          return;
        }

        const btn = document.getElementById("btnSave");
        const sp = document.getElementById("btnSaveSpinner");
        const txt = document.getElementById("btnSaveText");
        btn.disabled = true;
        sp.classList.remove("hidden");
        txt.innerText = "正在儲存至雲端...";

        const tempForm = document.createElement("form");
        tempForm.action = gasUrl;
        tempForm.method = "POST";
        tempForm.target = "hidden_upload_frame";

        const fields = {
          name: document.getElementById("name").value.trim(),
          formalTitle: document.getElementById("formalTitle").value.trim(),
          age: document.getElementById("age").value.trim(),
          deathDate: document.getElementById("deathDate").value.trim(),
          serviceDate: document.getElementById("serviceDate").value.trim(),
          location: document.getElementById("location").value.trim(),
          vigilLocation: document.getElementById("vigilLocation").value.trim(),
          familyMembers: document.getElementById("familyMembers").value.trim(),
          phoneAreaCode: document.getElementById("phoneAreaCode").value.trim(),
          tel: document.getElementById("tel").value.trim(),
          mobile: document.getElementById("mobile").value.trim(),
          city: document.getElementById("city").value.trim(),
          district: document.getElementById("district").value.trim(),
          village: document.getElementById("village").value.trim(),
          street: document.getElementById("street").value.trim(),
          fullAddress: document.getElementById("fullAddress").value.trim(),
          notes: document.getElementById("notes").value.trim(),
          imageBase64: base64Image || "",
        };

        for (const key in fields) {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = fields[key];
          tempForm.appendChild(input);
        }

        document.body.appendChild(tempForm);
        tempForm.submit();
        document.body.removeChild(tempForm);

        setTimeout(() => {
          alert("🎉 資料已成功送出至 Google 雲端！請查看試算表。");
          showStatus(
            "已成功送出至試算表與 Drive！",
            "text-emerald-600 font-bold",
          );

          document.getElementById("recordForm").reset();
          document.getElementById("imagePreview").src = "";
          document.getElementById("previewContainer").classList.add("hidden");
          document.getElementById("btnOcr").disabled = true;
          base64Image = "";

          btn.disabled = false;
          sp.classList.add("hidden");
          txt.innerText = "💾 確認校對無誤，儲存至雲端";
        }, 1500);
      }

      function showStatus(text, colorClass) {
        const msg = document.getElementById("statusMsg");
        msg.className = "text-xs truncate " + colorClass;
        msg.innerText = text;
      }
    </script>
  </body>
